{% extends "base.html" %}
{% block title %}{{ "Edit" if row else "New" }} Plan{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header"><div class="card-title">{{ "Edit" if row else "New" }} Plan</div></div>
    <div class="card-body">
        <form method="post">
            <div class="form-grid">
                <div class="form-group full">
                    <label>Plan name</label>
                    <input name="plan_name" required value="{{ row.plan_name if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Duration (months)</label>
                    <input type="number" min="1" name="duration_months" required
                           value="{{ row.duration_months if row else 1 }}">
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="number" step="0.01" min="0" name="price" required
                           value="{{ row.price if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Access level</label>
                    <select name="access_level" required>
                        {% for lvl in ['basic','standard','premium'] %}
                            <option value="{{ lvl }}" {% if row and row.access_level==lvl %}selected{% endif %}>{{ lvl }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary">Save</button>
                <a class="btn btn-ghost" href="{{ url_for('plans_list') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

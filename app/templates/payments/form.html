{% extends "base.html" %}
{% block title %}{{ "Edit" if row else "New" }} Payment{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header"><div class="card-title">{{ "Edit" if row else "New" }} Payment</div></div>
    <div class="card-body">
        <form method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>Member</label>
                    <select name="member_id" required>
                        <option value="">-- choose --</option>
                        {% for m in members %}
                            <option value="{{ m.member_id }}" {% if row and row.member_id==m.member_id %}selected{% endif %}>{{ m.name }} {{ m.surname }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Plan</label>
                    <select name="plan_id" required>
                        <option value="">-- choose --</option>
                        {% for p in plans %}
                            <option value="{{ p.plan_id }}" data-price="{{ p.price }}"
                                    {% if row and row.plan_id==p.plan_id %}selected{% endif %}>{{ p.plan_name }} ({{ p.price }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" step="0.01" name="amount" required
                           value="{{ row.amount if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="payment_date" required
                           value="{{ row.payment_date|fmt_date if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Method</label>
                    <select name="payment_method">
                        {% for m in ['cash','credit_card','debit_card','bank_transfer'] %}
                            <option value="{{ m }}" {% if row and row.payment_method==m %}selected{% endif %}>{{ m }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Next billing date (auto if blank)</label>
                    <input type="date" name="next_billing_date"
                           value="{{ row.next_billing_date|fmt_date if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="payment_status">
                        {% for s in ['pending','completed','failed','refunded'] %}
                            <option value="{{ s }}" {% if row and row.payment_status==s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary">Save</button>
                <a class="btn btn-ghost" href="{{ url_for('payments_list') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script>
  document.querySelector('select[name=plan_id]').addEventListener('change', e => {
      const amt = document.querySelector('input[name=amount]');
      if (!amt.value) {
          const opt = e.target.selectedOptions[0];
          amt.value = opt?.dataset?.price ?? '';
      }
  });
</script>
{% endblock %}

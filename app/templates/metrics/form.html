{% extends "base.html" %}
{% block title %}{{ "Edit" if row else "New" }} Metric{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header"><div class="card-title">{{ "Edit" if row else "New" }} Health Metric</div></div>
    <div class="card-body">
        <form method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>Member</label>
                    <select name="member_id" required>
                        <option value="">-- choose --</option>
                        {% for m in members %}
                            <option value="{{ m.member_id }}" {% if row and row.member_id==m.member_id %}selected{% endif %}>{{ m.name }} {{ m.surname }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Recorded date</label>
                    <input type="date" name="recorded_date" required
                           value="{{ row.recorded_date|fmt_date if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" step="0.01" name="weight" value="{{ row.weight if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Body fat (%)</label>
                    <input type="number" step="0.01" name="body_fat" value="{{ row.body_fat if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Muscle mass (kg)</label>
                    <input type="number" step="0.01" name="muscle_mass" value="{{ row.muscle_mass if row else '' }}">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary">Save</button>
                <a class="btn btn-ghost" href="{{ url_for('metrics_list') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

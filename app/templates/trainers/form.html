{% extends "base.html" %}
{% block title %}{{ "Edit" if row else "New" }} Trainer{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header"><div class="card-title">{{ "Edit" if row else "New" }} Trainer</div></div>
    <div class="card-body">
        <form method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>Name</label>
                    <input name="name" required value="{{ row.name if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Surname</label>
                    <input name="surname" required value="{{ row.surname if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Specialty</label>
                    <input name="specialty" value="{{ row.specialty if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Certification</label>
                    <input name="certification_level" value="{{ row.certification_level if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="employment_status">
                        {% for s in ['active','inactive','on_leave'] %}
                            <option value="{{ s }}" {% if row and row.employment_status==s %}selected{% endif %}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Hire date</label>
                    <input type="date" name="hire_date" required
                           value="{{ row.hire_date|fmt_date if row else '' }}">
                </div>
                <div class="form-group">
                    <label>Salary</label>
                    <input type="number" step="0.01" min="0" name="salary"
                           value="{{ row.salary if row else '' }}">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary">Save</button>
                <a class="btn btn-ghost" href="{{ url_for('trainers_list') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
